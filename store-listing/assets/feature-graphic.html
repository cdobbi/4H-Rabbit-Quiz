<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rabbit Savvy Feature Graphic</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 1024px;
            height: 500px;
            margin: 0;
            overflow: hidden;
            background: #143a54;
            color: #ffffff;
            font-family: "Poppins", Arial, sans-serif;
        }

        main {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #d8ebf4;
        }

        main::before {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 46%;
            content: "";
            background: url("../../assets/rabbitking.avif") no-repeat 52% 38% / cover;
        }

        main::after {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 54%;
            width: 8px;
            content: "";
            background: #e78263;
        }

        .content {
            position: relative;
            z-index: 1;
            width: 54%;
            height: 100%;
            padding: 58px 55px;
            background: #143a54;
        }

        .eyebrow {
            margin: 0 0 14px;
            color: #9bd0e6;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #ffffff;
            font-family: Georgia, serif;
            font-size: 68px;
            line-height: 0.98;
        }

        p {
            width: 410px;
            margin: 19px 0 25px;
            color: #d8ebf4;
            font-size: 21px;
            font-weight: 600;
            line-height: 1.35;
        }

        .topics {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .topics span {
            padding: 7px 9px;
            border: 1px solid #6eaec8;
            border-radius: 4px;
            background: #1d5878;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main>
        <div class="content">
            <div class="eyebrow">Offline Rabbit Study</div>
            <h1>Rabbit Savvy</h1>
            <p>Build practical knowledge for better care, better shows, and better breeding decisions.</p>
            <div class="topics">
                <span>Care</span>
                <span>Health</span>
                <span>Genetics</span>
                <span>Show Skills</span>
            </div>
        </div>
    </main>
</body>

</html>
